# Planted-vulnerable composite action for tests.
name: Notify
description: Posts the last commit message somewhere
inputs:
  channel:
    description: where to post
runs:
  using: composite
  steps:
    - uses: third-party/notify-action@v2.1.0
    - shell: bash
      run: |
        echo "Posting to ${{ inputs.channel }}"
        echo "${{ github.event.head_commit.message }}"
